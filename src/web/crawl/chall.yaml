apiVersion: berg.norelect.ch/v1
kind: Challenge
metadata:
  namespace: berg
  name: crawl
spec:
  author: sportshead
  flag: gaslightCTF{LLM_1nduc3d_4r4chn0ph0b1a}
  flagFormat: gaslightCTF{...}
  description: |
    AI crawlers never respect the rules...
  difficulty: easy
  categories:
    - web
  containers:
    - hostname: lighttpd
      image: CHALLENGE_IMAGE
      ports:
        - port: 80
          protocol: tcp
          appProtocol: http
          type: publicHttpRoute
      dynamicFlag:
        content:
          path: /www/super_secret/_flag.txt
