apiVersion: berg.norelect.ch/v1
kind: Challenge
metadata:
  namespace: berg
  name: thirds
spec:
  hideUntil: WAVE_1
  author: sportshead
  flag: gaslightCTF{th1rd_t1m35_th3_ch4rm}
  flagFormat: gaslightCTF{...}
  description: |
    Are you enjoying the OSINT photography? I try to follow the rule of thirds!
  difficulty: easy
  categories:
    - pwn
  containers:
    - hostname: chall
      image: CHALLENGE_IMAGE
      ports:
        - port: 1337
          protocol: tcp
          appProtocol: tcp
          type: publicTlsRoute
      dynamicFlag:
        content:
          path: /flag
